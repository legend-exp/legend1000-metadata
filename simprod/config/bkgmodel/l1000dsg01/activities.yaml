cables:
  description: >-
    HPGe high-voltage and signal cables, from their connection on the PEN plate
    of each HPGe unit, along the string, up to the Cable Attachment Position
    (CAP) of the string, about 40 cm above the top face of the highest HPGe.
  reference:
    Arnquist et al., EPJ Techn. Instrum. 10, 17 (2023); R. Saldanha (PNNL), 2026
  method: icpms
  mass_in_kg: 3.0
  specific_activity_in_uBq_per_kg:
    cables_Pb214_to_Po214: { val: 386, unc: 25 }
    cables_Pb212_to_Pb208: { val: 53, unc: 12 }

cable_connectors:
  description: >-
    Low-background zero insertion force (ZIF) connectors above the HPGe array,
    at the Cable Attachment Position (CAP) of each string, about 40 cm above the
    top face of the highest HPGe. They join the short cables coming from each
    HPGe unit to the long cables that run to the feedthrough flange at the top
    of the cryostat.
  reference: LEGEND-1000 CDR v2.1, Table XVII
  number_of_pieces: 336
  activity_per_piece_in_uBq:
    cable_connectors_Pb214_to_Po214: { val: 0.05, unc: 0.09 }
    cable_connectors_Pb212_to_Pb208: { val: 0.07, unc: 0.15 }

detector_mount_efcu:
  description: >-
    Copper holding the HPGe detectors. Per string: three vertical bars (3 mm
    diameter) along the string, three flaps per detector unit fixing the PEN
    plate to the bars, the tristar plate at the top, and a support bar going 42
    cm up from the tristar (LEGEND-200 shapes).
  reference: LEGEND-1000 CDR v2.1, Table XVII
  method: icpms
  mass_in_kg: 25.0
  specific_activity_in_uBq_per_kg:
    hpge_support_copper_Pb214_to_Po214: { val: 0.19, unc: 0.10 }
    hpge_support_copper_Pb212_to_Pb208: { val: 0.37, unc: 0.22 }
    hpge_support_copper_K40: { val: 10000, unc: 5000 } # a guess, see the description

detector_mount_ultem:
  description: >-
    Ultem insulators between the detectors and the copper. Three L-shaped pieces
    per detector unit, one at each copper bar: the detector rests on them, they
    rest on the PEN plate.
  reference: L-Note 24-014
  method: hpge
  mass_in_kg: 0.52
  specific_activity_in_uBq_per_kg:
    ultem_insulators_Pb214_to_Po214: { val: 160, unc: 30 }
    ultem_insulators_Pb212_to_Pb208: { val: 140, unc: 20 }

front_end_asic:
  description: >-
    Front-end ASIC chip of each HPGe unit, on the signal cable under the PEN
    plate.
  reference: >-
    F. Edzards et al., Investigation of ASIC-based signal readout electronics
    for LEGEND-1000, JINST 15, P09022 (2020)
  method: hpge
  mass_in_kg: 0.0111
  specific_activity_in_uBq_per_kg:
    front_end_electronics_Pb214_to_Po214: { limit: 2700, cl: 0.9 }
    front_end_electronics_Pb212_to_Pb208: { limit: 3200, cl: 0.9 }

hv_connector_ultem:
  description: Ultem clamp of the HV contact of each HPGe unit.
  reference: L-Note 24-014
  method: hpge
  mass_in_kg: 0.13
  specific_activity_in_uBq_per_kg:
    hv_clamps_Pb214_to_Po214: { val: 160, unc: 30 }
    hv_clamps_Pb212_to_Pb208: { val: 140, unc: 20 }

hv_connector_phbr:
  description: >-
    Phosphor bronze clip of the HV contact of each HPGe unit, part of the HV
    clamp.
  reference: L-Note 24-014
  method: icpms
  mass_in_kg: 0.10
  specific_activity_in_uBq_per_kg:
    hv_clamps_Pb214_to_Po214: { val: 134, unc: 18 }
    hv_clamps_Pb212_to_Pb208: { val: 23.7, unc: 2.0 }

fe_mount_ultem:
  description: >-
    Ultem stiffener plate that fixes the end of the signal cable, with the ASIC,
    onto the PEN plate of each HPGe unit
  reference: L-Note 24-014
  method: hpge
  mass_in_kg: 0.08
  specific_activity_in_uBq_per_kg:
    signal_clamps_Pb214_to_Po214: { val: 160, unc: 30 }
    signal_clamps_Pb212_to_Pb208: { val: 140, unc: 20 }

fe_mount_phbr:
  description: >-
    Phosphor bronze clips that fix the end of the HV cable onto the PEN plate of
    each HPGe unit.
  reference: L-Note 24-014
  method: icpms
  mass_in_kg: 0.10
  specific_activity_in_uBq_per_kg:
    signal_clamps_Pb214_to_Po214: { val: 134, unc: 18 }
    signal_clamps_Pb212_to_Pb208: { val: 23.7, unc: 2.0 }

pen_plates:
  description: PEN base plates of the HPGe units.
  reference: LEGEND-1000 CDR v2.1, Table XVII
  method: hpge
  mass_in_kg: 2.35
  specific_activity_in_uBq_per_kg:
    pen_plates_Pb214_to_Po214: { val: 65, unc: 12 }
    pen_plates_Pb212_to_Pb208: { val: 97, unc: 21 }

optical_fibers:
  description: >-
    Wavelength-shifting fibers of the LAr instrumentation, coated with TPB.
  reference: LEGEND-1000 CDR v2.1, Table XVII
  method: hpge
  mass_in_kg: 17.8
  specific_activity_in_uBq_per_kg:
    fibers_Pb214_to_Po214: { val: 540, unc: 80 }
    fibers_Pb212_to_Pb208: { val: 330, unc: 80 }

sipms:
  description: >-
    SiPM arrays reading out the fibers of the LAr instrumentation: one at the
    top and one at the bottom of each fiber module, three modules around each
    HPGe string.
  reference: P. Krause, PhD thesis, TUM (2023), Table 9.9
  method: hpge
  number_of_pieces: 252
  activity_per_piece_in_uBq:
    sipm_arrays_Pb214_to_Po214: { limit: 20.98, cl: 0.9 }
    sipm_arrays_Pb212_to_Pb208: { limit: 11.06, cl: 0.9 }

reentrance_tube_efcu:
  description: >-
    Lower section of the reentrance tube, closest to the HPGes, made of
    electroformed copper.
  reference: LEGEND-1000 CDR v2.1, Table XVII
  method: icpms
  mass_in_kg: 231
  specific_activity_in_uBq_per_kg:
    reentrance_tube_efcu_Pb214_to_Po214: { val: 0.19, unc: 0.10 }
    reentrance_tube_efcu_Pb212_to_Pb208: { val: 0.37, unc: 0.22 }

reentrance_tube_ofhc:
  description: >-
    Middle section of the reentrance tube made of commercial copper.
  reference: Abgrall et al., NIM A 828 (2016) 22
  method: icpms
  mass_in_kg: 670
  specific_activity_in_uBq_per_kg:
    reentrance_tube_ofhc_Pb214_to_Po214: { val: 1.4, unc: 0.2 }
    reentrance_tube_ofhc_Pb212_to_Pb208: { val: 1.1, unc: 0.15 }

wls_reflector:
  description: >-
    Wavelength-shifting reflector lining the reentrance tube: TPB-coated
    Tetratex foil.
  reference: L-Note 24-014
  method: hpge
  area_in_m2: 26
  specific_activity_in_uBq_per_m2:
    wls_reflector_Pb214_to_Po214: { val: 78, unc: 30 }
    wls_reflector_Pb212_to_Pb208: { limit: 92, cl: 0.9 }

underground_argon:
  description: >-
    Underground argon inside the reentrance tube, from the bottom of the tube up
    to 0.5 m above the top face of the highest HPGes.
  reference: LEGEND-1000 CDR v2.1, section XI.B.5
  mass_in_kg: 28500
  specific_activity_in_uBq_per_kg:
    liquid_argon_K42: { limit: 0.053, cl: 0.9 }

atmospheric_argon:
  description: >-
    Atmospheric argon around the reentrance tube: a layer 0.6 m thick around the
    side of the tube and 0.54 m thick below its bottom, up to the same height as
    the underground argon region (0.5 m above the top face of the highest
    HPGes).
  reference: LEGEND-1000 CDR v2.1, section XI.B.5
  mass_in_kg: 18700
  specific_activity_in_uBq_per_kg:
    liquid_argon_atmospheric_K42: { val: 61.4, unc: 5.4 }

hpge_detectors:
  description: Full germanium detector material.
  reference: >-
    LEGEND-1000 CDR v2.1, Sec. XI.B.1 (336 detectors of 3.0 kg on average) and
    Sec. XI.B.3 (limits from Gerda; the CDR does not state the confidence level)
  mass_in_kg: 1008
  specific_activity_in_uBq_per_kg:
    hpge_icpc_bulk_Pb214_to_Po214: { limit: 0.001, cl: 0.9 }
    hpge_icpc_bulk_Pb212_to_Pb208: { limit: 0.001, cl: 0.9 }

hpge_surface:
  description: >-
    The n+ and p+ surfaces of the HPGes, without the passivated surface
    (groove).
  reference: LEGEND-1000 CDR v2.1, section XI.B.5
  area_in_m2: 12.762
  specific_activity_in_uBq_per_m2:
    hpge_surface_K42: { limit: 40.8, cl: 0.9 }
