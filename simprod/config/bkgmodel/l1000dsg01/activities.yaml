underground_argon:
  description: >-
    42Ar with its progeny 42K, distributed homogeneously in the argon simulated
    by liquid_argon_K42: the argon inside a cylinder of radius 1.5 m and height
    3 m around the HPGe array (z from -1.8 m to +1.2 m), 7.3 m3 of underground
    argon in the reentrance tube and 13.4 m3 of atmospheric argon around it,
    from the geometry of the simulation. Its mass is 20.7 m3 times 1.39 g/cm3,
    minus about 0.3 t of detectors and their supports. Specific activity: 42Ar
    in atmospheric argon, (61.4 +- 5.4) uBq/kg (doi:10.1038/s41567-026-03257-9),
    divided by the 39Ar depletion factor of underground argon measured by
    DarkSide-50, 1400 +- 200 (Phys. Rev. D 93, 081101 (2016)), which is a lower
    limit on the depletion: (0.044 +- 0.007) uBq/kg, quoted as an upper limit at
    90% CL, 0.044 + 1.28 * 0.007 uBq/kg. The whole simulated argon has the
    activity of underground argon. The ion drift of 42K towards the detectors is
    not included
  reference: LEGEND-1000 CDR v2.1, section XI.B.5
  mass_in_kg: 28500
  specific_activity_in_uBq_per_kg:
    liquid_argon_K42: { limit: 0.053, cl: 0.9 }

atmospheric_argon:
  description: >-
    42Ar with its progeny 42K, distributed homogeneously in the atmospheric
    argon simulated by liquid_argon_atmospheric_K42. Specific activity: 42Ar in
    atmospheric argon, (61.4 +- 5.4) uBq/kg (doi:10.1038/s41567-026-03257-9).
    The mass is a rough estimate, the 13.4 m3 of atmospheric argon around the
    reentrance tube of underground_argon: its 28500 kg minus the 9800 kg inside
    the tube
  reference: LEGEND-1000 CDR v2.1, section XI.B.5
  mass_in_kg: 18700
  specific_activity_in_uBq_per_kg:
    liquid_argon_atmospheric_K42: { val: 61.4, unc: 5.4 }

hpge_surface:
  description: >-
    42K from the 42Ar of the underground argon, collected by the HPGe detectors,
    as one activity. Half of it is on the n+ and p+ surfaces: the simulations
    hpge_nplus_surface_K42 and hpge_pplus_surface_K42 get half of it, by their
    areas, and the other half stays homogeneous in the argon, in
    liquid_argon_K42. The 42Ar of the underground argon within the region
    simulated by liquid_argon_K42 (see underground_argon), about 1 m around the
    array, is collected on the detectors: 7.3 m3 inside the reentrance tube,
    minus about 0.2 m3 of detectors and their supports, times 1.39 g/cm3, 9800
    kg, times 0.053 uBq/kg (upper limit at 90% CL) = 520 uBq. The argon outside
    the tube is not collected. The area is that of the n+ and p+ surfaces of the
    336 detectors, 12.61 m2 and 0.152 m2 from pygeom-hpges for the V99999Z
    design: 40.8 uBq/m2. The passivated surfaces (0.200 m2) have no simulation,
    and their share is on the n+ and p+ surfaces
  reference: LEGEND-1000 CDR v2.1, section XI.B.5
  area_in_m2: 12.762
  specific_activity_in_uBq_per_m2:
    hpge_surface_K42: { limit: 40.8, cl: 0.9 }
