hpge_nplus_surface:
  command: >-
    revertex hpge-surf-pos --detectors V* --surface-type nplus --gdml
    {GDML_FILE} --out-file {OUTPUT_FILE} --n-events {N_EVENTS}
  product: positions

hpge_pplus_surface:
  command: >-
    revertex hpge-surf-pos --detectors V* --surface-type pplus --gdml
    {GDML_FILE} --out-file {OUTPUT_FILE} --n-events {N_EVENTS}
  product: positions
