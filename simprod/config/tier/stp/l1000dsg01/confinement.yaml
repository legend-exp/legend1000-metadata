  - /RMG/Generator/Confinement/Geometrical/Cylinder/OuterRadius 1.5 m
  - /RMG/Generator/Confinement/Geometrical/Cylinder/Height 3 m

# atmospheric LAr within ~0.5 m of the re-entrance tube (outer r 0.999 m,
# bottom z -1.26 m) up to 0.5 m above the top of the UAr optical map (z 1.375 m)
lar_atmospheric:
