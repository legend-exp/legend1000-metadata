optmap_per_sipm: false
light_source: optmap
scintillators:
  # optical map in paths.optical_maps.lar of the Simflow configuration
  lar:
    table: liquid_argon_underground
    material: lar
  # dummy parameters, to be replaced by measured or simulated values
  pen:
    table: pen
    material: pen
    model:
      function: legendsimflow.opt_models.uniform
      kwargs:
        # summed over all SiPMs
        prob: 0.12
  fiber:
    table: fiber
    material: fiber
    model:
      function: legendsimflow.opt_models.l1000_fibers
      kwargs:
        amplitudes: [0.01, 0.01, 0.01]
        absorption_lengths_in_m: [0.05, 0.2, 4]
store_expected_pes: true
optmap_scaling_factor: 1
photoelectron_resolution_sigma: 0.3
time_resolution_in_ns: 16
max_pes_per_hit_per_sipm: 5
max_pes_per_hit_combined: 100
buffer_len: 10*MB
